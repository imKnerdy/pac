<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Art Convertor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">Pixel Art Convertor</h1>
    <p class="header__subtitle">Turn any image into a gridded, colour limited pattern.</p>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="field">
        <label class="field__label" for="file">Image</label>
        <input class="file" type="file" id="file" accept="image/*">
      </div>

      <div class="field">
        <label class="field__label" for="g">
          Grid size <span class="field__value" id="gVal">48</span>
        </label>
        <input class="range" type="range" id="g" min="16" max="96" value="48">
      </div>

      <div class="field">
        <label class="field__label" for="k">
          Colours <span class="field__value" id="kVal">10</span>
        </label>
        <input class="range" type="range" id="k" min="2" max="24" value="10">
      </div>

      <div class="field">
        <label class="field__label" for="s">
          Saturation boost <span class="field__value" id="sVal">1.2</span>
        </label>
        <input class="range" type="range" id="s" min="0.5" max="2" step="0.1" value="1.2">
      </div>

      <div class="field">
        <label class="field__label" for="c">
          Export cell size (px) <span class="field__value" id="cVal">10</span>
        </label>
        <input class="range" type="range" id="c" min="4" max="20" value="10">
      </div>

      <label class="check">
        <input type="checkbox" id="grid" checked>
        <span>Show grid lines</span>
      </label>

      <button class="btn" id="save" type="button">Download PNG</button>
    </aside>

    <section class="preview">
      <canvas class="preview__canvas" id="out"></canvas>
      <div class="palette" id="palette"></div>
    </section>
  </main>

<script src="script.js"></script>
</body>
</html>
