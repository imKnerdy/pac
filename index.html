<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Art Pattern Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <input type="file" id="file" accept="image/*">

  <label>Grid size (cells per side): <span id="gVal">48</span></label>
  <input type="range" id="g" min="16" max="96" value="48">

  <label>Colours: <span id="kVal">10</span></label>
  <input type="range" id="k" min="2" max="24" value="10">

  <label>Saturation boost: <span id="sVal">1.2</span></label>
  <input type="range" id="s" min="0.5" max="2" step="0.1" value="1.2">

  <label>Cell size (px): <span id="cVal">10</span></label>
  <input type="range" id="c" min="4" max="20" value="10">

  <label><input type="checkbox" id="grid" checked> Show grid lines</label>

  <button id="save">Download PNG</button>
  <br>
  <canvas id="out"></canvas>
  <div id="palette"></div>

<script src="script.js"></script>
</body>
</html>
